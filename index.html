<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Jeu de Skate Animé</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #fff;
            text-align: center;
            font-family: Arial, sans-serif;
            margin-top: 50px;
        }
        canvas {
            background-color: #87CEEB;
            border: 4px solid #fff;
            box-shadow: 0px 0px 20px rgba(255,255,255,0.2);
        }
    </style>
</head>
<body>
    <h1>Mon Jeu de Skate</h1>
    <p>Appuyez sur la <strong>Barre Espace</strong> pour faire un Kickflip au-dessus des obstacles !</p>
    <canvas id="jeuCanvas" width="800" height="300"></canvas>

    <script>
        const canvas = document.getElementById("jeuCanvas");
        const ctx = canvas.getContext("2d");

        // Skateur avec gestion de la rotation pour le saut
        let skater = {
            x: 80,
            y: 200,
            width: 40,
            height: 60,
            vy: 0,
            gravity: 0.6,
            jumpPower: -12,
            isJumping: false,
            angle: 0 // Angle pour l'animation du flip
        };

        // Obstacle (poubelle ou barrière)
        let obstacle = {
            x: 800,
            y: 220,
            width: 30,
            height: 40,
            speed: 6
        };

        let score = 0;
        let gameOver = false;

        document.addEventListener("keydown", function(e) {
            if (e.code === "Space") {
                if (!skater.isJumping && !gameOver) {
                    skater.vy = skater.jumpPower;
                    skater.isJumping = true;
                }
                if (gameOver) {
                    resetGame();
                }
            }
        });

        function resetGame() {
            skater.y = 200;
            skater.vy = 0;
            skater.isJumping = false;
            skater.angle = 0;
            obstacle.x = 800;
            obstacle.speed = 6;
            score = 0;
            gameOver = false;
            loop();
        }

        function update() {
            if (gameOver) return;

            // Gravité et physique du saut
            skater.vy += skater.gravity;
            skater.y += skater.vy;

            // Animation du Kickflip (rotation à 360° pendant le saut)
            if (skater.isJumping) {
                skater.angle += 0.15; // Fait tourner le personnage
            }

            // Gestion de l'atterrissage sur le sol
            if (skater.y > 200) {
                skater.y = 200;
                skater.vy = 0;
                skater.isJumping = false;
                skater.angle = 0; // Remet le skate droit au sol
            }

            // Mouvement de l'obstacle
            obstacle.x -= obstacle.speed;
            if (obstacle.x < -30) {
                obstacle.x = 800;
                score++;
                obstacle.speed += 0.3; // Augmente la vitesse au fil du temps
            }

            // Boîte de collision simplifiée
            if (
                obstacle.x < skater.x + skater.width &&
                obstacle.x + obstacle.width > skater.x &&
                obstacle.y < skater.y + skater.height &&
                obstacle.y + obstacle.height > skater.y
            ) {
                gameOver = true;
            }
        }

        function drawSkater() {
            ctx.save();
            // On déplace le point d'origine au centre du skateur pour la rotation
            ctx.translate(skater.x + skater.width / 2, skater.y + skater.height / 2);
            ctx.rotate(skater.angle);

            // Dessin du skateur (Coordonnées locales centrées sur 0,0)
            let ox = -skater.width / 2;
            let oy = -skater.height / 2;

            // 1. Le corps / T-shirt (Bleu)
            ctx.fillStyle = "#3498db";
            ctx.fillRect(ox + 10, oy + 20, 20, 25);

            // 2. La tête (Couleur chair)
            ctx.fillStyle = "#ffdbac";
            ctx.fillRect(ox + 13, oy + 5, 14, 15);

            // 3. La casquette (Rouge)
            ctx.fillStyle = "#e74c3c";
            ctx.fillRect(ox + 10, oy, 17, 6); // Sommet
            ctx.fillRect(ox + 18, oy + 4, 14, 3); // Visière vers l'avant

            // 4. Les pantalons (Jean noir)
            ctx.fillStyle = "#2c3e50";
            ctx.fillRect(ox + 10, oy + 45, 9, 10); // Jambe gauche
            ctx.fillRect(ox + 21, oy + 45, 9, 10); // Jambe droite

            // 5. La Planche de Skate (Marron et roues noires)
            ctx.fillStyle = "#d35400"; // Planche en bois
            ctx.fillRect(ox, oy + 55, skater.width, 5);
            
            ctx.fillStyle = "#000"; // Roue gauche
            ctx.beginPath();
            ctx.arc(ox + 8, oy + 61, 4, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#000"; // Roue droite
            ctx.beginPath();
            ctx.arc(ox + skater.width - 8, oy + 61, 4, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        function draw() {
            // Ciel
            ctx.fillStyle = "#87CEEB";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Soleil
            ctx.fillStyle = "#f1c40f";
            ctx.beginPath();
            ctx.arc(700, 50, 30, 0, Math.PI * 2);
            ctx.fill();

            // Sol (Trottoir / Route)
            ctx.fillStyle = "#7f8c8d";
            ctx.fillRect(0, 260, canvas.width, 40);
            ctx.fillStyle = "#95a5a6"; // Ligne du trottoir
            ctx.fillRect(0, 260, canvas.width, 4);

            // Appel de la fonction de dessin du skateur
            drawSkater();

            // Obstacle (Une bouche d'incendie rouge)
            ctx.fillStyle = "#e74c3c";
            ctx.fillRect(obstacle.x, obstacle.y, obstacle.width, obstacle.height);
            ctx.fillStyle = "#c0392b";
            ctx.fillRect(obstacle.x + 5, obstacle.y - 5, obstacle.width - 10, 5);

            // Score
            ctx.fillStyle = "#fff";
            ctx.font = "bold 20px Arial";
            ctx.fillText("Score : " + score, 20, 35);

            // Écran de fin
            if (gameOver) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#fff";
                ctx.font = "bold 40px Arial";
                ctx.fillText("GAME OVER", 280, 130);
                ctx.font = "20px Arial";
                ctx.fillText("Appuyez sur Espace pour retenter un trick !", 210, 180);
            }
        }

        function loop() {
            update();
            draw();
            if (!gameOver) {
                requestAnimationFrame(loop);
            }
        }

        loop();
    </script>
</body>
</html>
